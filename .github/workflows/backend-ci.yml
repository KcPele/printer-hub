name: ci

on:
  push:
    branches: [main]
    paths: &watched
      - "backend/**"
      - "packages/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    paths: *watched

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: printerhub
          POSTGRES_PASSWORD: printerhub
          POSTGRES_DB: printerhub
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U printerhub"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6380:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest -m "not integration" --cov --cov-report=term-missing
      - name: OpenAPI contract is current
        run: |
          uv run python -m scripts.export_openapi
          git diff --exit-code openapi.json

  api-client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Client types match the API contract
        run: |
          pnpm api:generate
          git diff --exit-code packages/api-client/src/schema.d.ts
      - run: pnpm api:check
