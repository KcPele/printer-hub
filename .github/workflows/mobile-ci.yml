name: mobile-ci

on:
  push:
    branches: [main]
    paths: &watched
      - "printerhub/**"
      - "backend/openapi.json"
      - ".github/workflows/mobile-ci.yml"
  pull_request:
    paths: *watched

concurrency:
  group: mobile-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Formats, analyzes, lints blocs, and runs the tests with 100% coverage required.
    uses: VeryGoodOpenSource/very_good_workflows/.github/workflows/flutter_package.yml@v1
    with:
      working_directory: printerhub
      flutter_version: "3.47.x"
      run_bloc_lint: true

  packages:
    # The same checks for each package the app is built from.
    strategy:
      fail-fast: false
      matrix:
        package:
          - app_ui
          - auth_repository
          - jobs_repository
          - documents_repository
          - notifications_repository
          - local_store
          - organizations_repository
          - preferences_repository
          - printer_discovery
          - printers_repository
    uses: VeryGoodOpenSource/very_good_workflows/.github/workflows/flutter_package.yml@v1
    with:
      working_directory: printerhub/packages/${{ matrix.package }}
      flutter_version: "3.47.x"

  dart-packages:
    # The packages with no Flutter in them.
    strategy:
      fail-fast: false
      matrix:
        package: [api_client, connection_engine, printer_protocols]
    uses: VeryGoodOpenSource/very_good_workflows/.github/workflows/dart_package.yml@v1
    with:
      working_directory: printerhub/packages/${{ matrix.package }}
      dart_sdk: "3.13.5"
      coverage_excludes: "**/*.g.dart"

  api-client-is-current:
    # The Dart client is generated from the contract and checked in. This
    # fails when backend/openapi.json changed and `make openapi` was not run.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.x"
          channel: stable
          cache: true
      - name: Regenerate the client
        working-directory: printerhub/packages/api_client
        run: |
          dart pub get
          rm -rf lib/src/generated
          dart run swagger_parser
          dart run build_runner build --delete-conflicting-outputs
          dart format lib/src/generated > /dev/null
          python3 tool/make_fixtures.py
      - name: Fail when the checked-in client is stale
        run: git diff --exit-code -- printerhub/packages/api_client
