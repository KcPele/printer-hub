name: printer_discovery
description: Finds printers near the phone - on the network, by QR code, NFC, and Bluetooth.
version: 0.1.0+1
publish_to: none

environment:
  sdk: ^3.13.0
  flutter: ^3.47.0

dependencies:
  bonsoir: ^7.1.5
  equatable: ^3.0.0
  flutter:
    sdk: flutter
  flutter_blue_plus: ^2.3.14
  mobile_scanner: ^7.4.2
  ndef_record: ^1.5.0
  network_info_plus: ^8.2.1
  nfc_manager: ^4.2.1
  nfc_manager_ndef: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.5
  very_good_analysis: ^11.0.0
