name: printerhub
description: Print, scan, and manage printers from your phone.
version: 1.0.0+1
publish_to: none

environment:
  sdk: ^3.13.0
  flutter: ^3.47.0

dependencies:
  api_client:
    path: packages/api_client
  app_ui:
    path: packages/app_ui
  auth_repository:
    path: packages/auth_repository
  bloc: ^9.2.1
  connection_engine:
    path: packages/connection_engine
  device_info_plus: ^13.3.0
  documents_repository:
    path: packages/documents_repository
  equatable: ^3.0.0
  file_picker: ^13.1.0
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_localizations:
    sdk: flutter
  go_router: ^18.0.2
  image: ^4.10.1
  intl: ^0.20.2
  jobs_repository:
    path: packages/jobs_repository
  local_store:
    path: packages/local_store
  material_ui: ^1.1.1
  meta: ^1.19.0
  mobile_scanner: ^7.4.2
  notifications_repository:
    path: packages/notifications_repository
  organizations_repository:
    path: packages/organizations_repository
  package_info_plus: ^10.2.2
  pdf: ^3.13.1
  preferences_repository:
    path: packages/preferences_repository
  printer_discovery:
    path: packages/printer_discovery
  printer_protocols:
    path: packages/printer_protocols
  printers_repository:
    path: packages/printers_repository
  printing: ^5.15.1
  qr_flutter: ^4.1.0
  share_plus: ^13.3.1

dev_dependencies:
  bloc_lint: ^0.4.2
  bloc_test: ^10.0.0
  bloc_tools: ^0.1.0-dev.24
  dio: ^5.11.1
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.5
  very_good_analysis: ^11.0.0

flutter:
  generate: true
  uses-material-design: true
