[project]
name = "printerhub-backend"
version = "0.1.0"
description = "PrinterHub shared backend API"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.0",
    "argon2-cffi>=25.1.0",
    "arq>=0.28.0",
    "asyncpg>=0.32.0",
    "boto3>=1.43.108",
    "cryptography>=50.0.2",
    "fastapi>=0.142.2",
    "httpx[http2]>=0.28.1",
    "pydantic-settings>=2.15.0",
    "pydantic[email]>=2.13.5",
    "pyjwt[crypto]>=2.15.1",
    "redis>=5.3.1",
    "sqlalchemy[asyncio]>=2.1.3",
    "structlog>=26.1.0",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.10",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py314"
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = [
    "E", "F", "W",  # pycodestyle, pyflakes
    "I",            # isort
    "UP",           # pyupgrade
    "B",            # bugbear
    "C4",           # comprehensions
    "SIM",          # simplify
    "ASYNC",        # async pitfalls
    "S",            # security (bandit)
    "PT",           # pytest style
    "RUF",
    "TID",          # tidy imports
    "DTZ",          # timezone-aware datetimes
    "T20",          # no print
]
ignore = [
    "B008",    # FastAPI Depends() in argument defaults
    "RUF012",  # SQLAlchemy __table_args__ / __mapper_args__
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]
"scripts/**" = ["T20"]
"migrations/**" = ["E501"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.isort]
known-first-party = ["app", "simulator", "tests", "scripts"]

[tool.mypy]
python_version = "3.14"
strict = true
plugins = ["pydantic.mypy"]
files = ["app", "simulator", "scripts", "tests"]

[[tool.mypy.overrides]]
module = ["boto3.*", "botocore.*", "arq.*"]
ignore_missing_imports = true
follow_untyped_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
addopts = "-q --strict-markers"
markers = [
    "integration: needs a real external service beyond Postgres and Redis (MinIO)",
]
filterwarnings = ["error::DeprecationWarning:app.*"]

[tool.coverage.run]
source = ["app", "simulator"]
branch = true
